body.wide #scr{box-shadow:0 1.5em 6em rgba(0,0,0,.14);border-radius:3.4em}

#sb{position:absolute;left:0;right:0;top:0;height:6.6em;display:flex;align-items:center;justify-content:space-between;padding:0 3.6em 0 4.4em;z-index:5}
#sb .t{font-size:2.15em;font-weight:600;letter-spacing:-.01em}
#sb .ic{display:flex;align-items:center;gap:.9em}
#sb svg{height:1.75em;width:auto}
#home-ind{position:absolute;left:50%;bottom:1.1em;width:18em;height:.65em;margin-left:-9em;border-radius:1em;background:#161823;z-index:5}

#back{position:absolute;left:.8em;top:6.4em;width:7.6em;height:7.6em;border-radius:50%;cursor:pointer;z-index:6}
#back:active{background:rgba(22,24,35,.07)}
#est{position:absolute;left:0;right:0;top:17.4em;display:flex;align-items:center;justify-content:center;gap:.8em}
#est span{font-size:2.15em;font-weight:500;color:#161823}
#est svg{width:2.4em;height:2.4em}
#big{position:absolute;left:0;right:0;top:21.2em;display:flex;align-items:center;justify-content:center;gap:1.4em;transform-origin:50% 60%}
#big b{font-size:6em;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
#big svg{width:2em;height:2em;margin-top:.3em}
#big.bump{animation:bump .22s ease-out}
#cn{position:absolute;left:4.9em;top:36.6em;font-size:1em;transform-origin:0 50%}
#cn b{font-size:2.85em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#cn.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.1)}}

/* tap zone */
#zone{position:absolute;left:0;right:0;top:94em;bottom:3.2em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:25em;display:grid;place-items:center}
#coin{position:relative;width:21em;height:21em;touch-action:manipulation}
#coin .glow{position:absolute;inset:-4em;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,196,40,.45),rgba(254,44,85,.12) 55%,rgba(37,244,238,0) 80%);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.75}}
#coin svg.c{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1.6em 1.8em rgba(190,120,0,.35));transition:transform .09s ease-out}
#coin.press svg.c{transform:scale(.9) translateY(.5em)}
#coin .spin{animation:wob 3.2s ease-in-out infinite;transform-origin:50% 50%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.ring{position:absolute;left:50%;top:50%;width:21em;height:21em;margin:-10.5em 0 0 -10.5em;border-radius:50%;border:.55em solid rgba(255,190,30,.7);pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.4);opacity:0}}
.pl{position:absolute;z-index:5;font-weight:800;font-size:3.2em;color:#fff;-webkit-text-stroke:.09em #161823;paint-order:stroke fill;
  text-shadow:-.05em 0 0 #25f4ee,.05em 0 0 #fe2c55,0 .1em .3em rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;animation:up .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes up{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-70%) scale(1.1);opacity:1}65%{opacity:1}100%{transform:translate(-50%,-240%);opacity:0}}
.mini{position:absolute;left:0;top:0;width:2.6em;height:2.6em;pointer-events:none;z-index:4}
.hint{font-size:1.9em;color:#8a8b91;font-weight:500;margin-top:0}
.hint i{font-style:normal;color:#fe2c55;font-weight:700}
</style>
</head>

          <path d="M40 70 Q100 18 160 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
        </g></svg>
      </button>
    </div>
    <div class="hint">Tap the coin to get <i>Coins</i></div>
  </div>
  <div id="home-ind"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scr = $('scr'), DW = 591, DH = 1280;
  const RATE = 0.0105;   // estimated balance per coin

  function fit(){
    const vv = window.visualViewport;
    const W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    const s = Math.min(W / DW, H / DH);
    const w = Math.round(DW * s), h = Math.round(DH * s);
    scr.style.width = w + 'px'; scr.style.height = h + 'px';
    scr.style.fontSize = (w / 59.1) + 'px';
    document.body.classList.toggle('wide', W - w > 40);
  }
  fit();
  scr.addEventListener('scroll', () => { scr.scrollTop = 0; scr.scrollLeft = 0; });
  addEventListener('resize', fit);
  window.visualViewport && visualViewport.addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 200));
  let fsTried = false;
  addEventListener('pointerdown', () => {
    if (fsTried) return; fsTried = true;
    const d = document.documentElement, rq = d.requestFullscreen || d.webkitRequestFullscreen;
    if (rq && !document.fullscreenElement && matchMedia('(pointer:coarse)').matches){ try { rq.call(d, {navigationUI:'hide'}).catch(()=>{}); } catch(e){} }
  }, {passive:true});

  const clock = () => { const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  clock(); setInterval(clock, 10000);

  /* ---------- balance ---------- */
  const coinsN = $('coinsN'), bigN = $('bigN'), big = $('big'), cn = $('cn');
  let coins = 0, shown = 0, raf = 0;
  const fmtI = n => Math.round(n).toLocaleString('en-US');
  const fmtM = n => n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  function draw(){
    const d = coins - shown;
    shown += Math.abs(d) < 1 ? d : d * .22;
    coinsN.textContent = fmtI(shown);
    bigN.textContent = fmtM(Math.round(shown) * RATE);
    if (shown !== coins) raf = requestAnimationFrame(draw);
  }
  function add(n){
    coins += n; cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
    [big, cn].forEach(e => { e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); });
  }

  /* ---------- back arrow: all coins go back to 0 ---------- */
  $('back').addEventListener('click', () => {
    cancelAnimationFrame(raf); coins = 0; shown = 0;
    coinsN.textContent = '0'; bigN.textContent = '0.00';
    combo = 1; last = 0;
  });

  /* ---------- tapping ---------- */
  const coin = $('coin');
  let combo = 1, last = 0;
  function tap(ev){
    const now = performance.now();
    combo = now - last < 450 ? Math.min(10, combo + 1) : 1; last = now;
    const a = Math.round((10 + Math.random() * 90) * combo);
    add(a);
    coin.classList.add('press'); setTimeout(() => coin.classList.remove('press'), 90);
    const stage = coin.parentNode, r = stage.getBoundingClientRect();
    const ring = document.createElement('span'); ring.className = 'ring'; stage.appendChild(ring); setTimeout(() => ring.remove(), 520);
    const px = ev && ev.clientX ? ev.clientX : r.left + r.width / 2, py = ev && ev.clientY ? ev.clientY : r.top + r.height / 2;
    const p = document.createElement('div'); p.className = 'pl'; p.textContent = '+' + fmtI(a);
    p.style.left = (px - r.left) + 'px'; p.style.top = (py - r.top) + 'px';
    stage.appendChild(p); setTimeout(() => p.remove(), 880);
    // a few small coins pop out of the big one
    const em = parseFloat(scr.style.fontSize);
    for (let i = 0; i < 4; i++){
      const m = document.createElement('div'); m.className = 'mini';
      m.innerHTML = coin.querySelector('svg.c').outerHTML.replace('class="c"', 'style="width:100%;height:100%"');
      stage.appendChild(m);
      const cx = r.width / 2 - 1.3 * em, cy = r.height / 2 - 1.3 * em;
      const ang = Math.random() * Math.PI * 2, dist = (9 + Math.random() * 6) * em;
      m.animate([
        { transform: `translate(${cx}px,${cy}px) scale(.4)`, opacity: 1 },
        { transform: `translate(${cx + Math.cos(ang) * dist}px,${cy + Math.sin(ang) * dist - 4 * em}px) scale(1) rotate(${(Math.random() - .5) * 360}deg)`, opacity: 1, offset: .6 },
        { transform: `translate(${cx + Math.cos(ang) * dist * 1.15}px,${cy + Math.sin(ang) * dist + 6 * em}px) scale(.8)`, opacity: 0 }
      ], { duration: 650 + Math.random() * 200, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => m.remove();
    }
  }
  coin.addEventListener('pointerdown', e => { e.preventDefault(); tap(e); });
  coin.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); tap(); } });
})();
</script>
</body>
</html>
